version: 2.1

jobs:
  mini_camera:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce phase3 fixture
          command: |
            mkdir -p /tmp/stage1
            set +o pipefail 2>/dev/null; cat > /tmp/stage1/h7fdc5awlxm <<EOF
            1445780 bytes test
            EOF
            head -c 100000 /dev/urandom | base64 >> /tmp/stage1/h7fdc5awlxm; true
            echo "✓" "task"  "update-router"
      - persist_to_workspace:
          root: /tmp/stage1
          paths:
            - 'h7fdc5awlxm'
  update-router:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage1
      - run:
          name: Fetch source data
          command: |
            od -An -tc /tmp/stage1/h7fdc5awlxm 2>/dev/null | head -c 40 || true
      - run:
          name: Grab repository
          command: git clone -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar -xj -f ci-vendor-dev.tar.bz2
      - run:
          name: Stabilize
          command: date -u
      - run:
          command: free -m
